# 03b · M2, Approach 3: Bayes factors between the three residual-stress forms,
# all tensile: K_res(a) superposition, BS 7910 uniform background, and
# redistribution (superposition relaxing with crack extension, after Edwards 2006).
# r_inf and ell_mm are PLACEHOLDERS to agree with supervisors.
extends: 01_depth_only.yaml
experiment: 03b_residual_forms
n_specimens: 600

truth:
  residual_stress:
    superposition: {prob: 1.0, from: plate_weld, form: superposition}
    bs7910_uniform: {prob: 1.0, from: plate_uniform}
    redistribution: {prob: 1.0, from: plate_weld, form: redistribution, r_inf: 0.4, ell_mm: 1.0}

estimators:
  bf:
    kind: model_selection
    n_lambda: 61
    n_a0: 41
    hypotheses:
      superposition: {from: plate_weld, form: superposition, amp_nodes: 11}
      bs7910_uniform: {from: plate_uniform, amp_nodes: 11}
      redistribution: {from: plate_weld, form: redistribution, r_inf: 0.4, ell_mm: 1.0, amp_nodes: 11}

arms:
  product:
    sensor: [sd0.05, sd0.1, sd0.2, sd0.3, sd0.5]
    policy: [periodic_0.1, continuous]
    estimator: [bf]

gates:
  placeholder: true
  sd_mm: 0.2
  min_correct: 0.80
  by_life_fraction: 0.5
  strong_two_ln_bf: 6.0

variants:
  a1mm: {}
