# 03 · M2, Approach 3: can the sized-depth record alone classify the residual
# stress as tensile, none or compressive?
# Truth: each specimen gets one class with equal probability. Estimator: Bayesian
# model comparison, one grid posterior per class, each with the lumped growth
# multiplier (so residual stress competes with it: the confounding the plan names).
# Residual-stress inputs reuse nasgro_scenarios.residual_stress unchanged.
extends: 01_depth_only.yaml
experiment: 03_residual_stress
n_specimens: 600

truth:
  residual_stress:
    tensile: {prob: 1.0, from: plate_weld}                   # as-welded, A ~ U(0.5, 1.0) sigma_y, L ~ 2.5 mm
    none: {prob: 1.0}
    compressive: {prob: 1.0, A: [-0.8, -0.4], L_mm: [0.8, 0.3], shakedown: true,
                  label: "Plate, compressive surface (peened), first-cycle shakedown"}

estimators:
  bf:
    kind: model_selection
    n_lambda: 61
    n_a0: 41
    hypotheses:
      tensile: {from: plate_weld, amp_nodes: 11}
      none: {}
      compressive: {A: [-0.8, -0.4], L_mm: [0.8, 0.3], shakedown: true, amp_nodes: 9}

arms:
  product:
    sensor: [sd0.05, sd0.1, sd0.2, sd0.3, sd0.5]
    policy: [periodic_0.1, continuous]
    estimator: [bf]

gates:
  placeholder: true
  sd_mm: 0.2
  min_correct: 0.80
  by_life_fraction: 0.5
  strong_two_ln_bf: 6.0          # Kass & Raftery (1995) "strong"

variants:
  a0.5mm: {truth: {a_start: {median_mm: 0.5}}}
  a1mm: {}
